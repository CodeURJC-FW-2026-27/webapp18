<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game4Life - {{submitText}}</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/Style/favicon.ico" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS theme -->
    <link href="/Style/New_element/styles.css" rel="stylesheet">
</head>

<body>

    <!-- Navegation -->
    {{>partials/header}}
    <!-- Banner -->
    <header class="bg-dark text-white py-4">
        <div class="container text-center">
            <h2 class="fw-bolder">Game4Life</h2>
            <p class="mb-0">{{submitText}}</p>
        </div>
    </header>

    <!-- Form -->
    <section class="py-5">
        <div class="container">

            <div class="formulario-consola">

                <h1>
                    <i class="bi bi-controller"></i>
                    {{submitText}}
                </h1>

                <p class="subtitulo">
                    Rellena los siguientes campos de la consola.
                </p>

                <form method="post" action="{{action}}" enctype="multipart/form-data">

                    <!-- Name -->
                    <div class="campo">
                        <label for="nombre" class="form-label">
                            Nombre de la consola *
                        </label>

                        <input type="text" class="form-control"
                               id="nombre" name="name"
                               value="{{console.name}}"
                               placeholder="Ej. PlayStation 5"
                               required maxlength="100">
                    </div>

                    <!-- Brand -->
                    <div class="campo">
                        <label for="marca" class="form-label">
                            Marca *
                        </label>

                        <select class="form-select" id="marca"
                                name="brand" required>
                            <option value="" disabled {{^console}}selected{{/console}}>Selecciona una marca</option>
                            <option value="Sony" {{#isSony}}selected{{/isSony}}>Sony</option>
                            <option value="Xbox" {{#isXbox}}selected{{/isXbox}}>Xbox</option>
                            <option value="Nintendo" {{#isNintendo}}selected{{/isNintendo}}>Nintendo</option>
                            <option value="Otros" {{#isOtros}}selected{{/isOtros}}>Otros</option>
                        </select>
                    </div>

                    <!-- Year of creation -->
                     <div class="campo">
                       <label for="anio" class="form-label">
                        Año de creación *
                       </label>
                         <input type="number"
                          class="form-control"
                          id="anio"
                          name="year"
                          value="{{console.year}}"
                          placeholder="Ej. 2020"
                          min="1972"
                          max="2026"
                          step="1"
                          required>
                     </div>

                    <!-- Image -->
                    <div class="campo">
                        <label for="imagen" class="form-label">
                           Imagen {{#isNew}}*{{/isNew}}
                        </label>

                        <input type="file" class="form-control"
                               id="imagen" name="imagepreview"
                               accept=".jpg,.jpeg,.png"
                               {{#isNew}}required{{/isNew}}>

                        <div class="form-text">
                            Introduce la imagen de la consola.
                        </div>
                    </div>

                    <div class="campo">
                        <label for="imagen" class="form-label">
                           Imagen de fondo {{#isNew}}*{{/isNew}}
                        </label>

                        <input type="file" class="form-control"
                               id="imagen" name="imagemain"
                               accept=".jpg,.jpeg,.png"
                               {{#isNew}}required{{/isNew}}>

                        <div class="form-text">
                            Introduce la imagen de fondo de la consola.
                        </div>
                    </div>

                    <!-- Price -->
                    <div class="campo">
                        <label for="precio" class="form-label">
                            Precio (€) *
                        </label>

                        <input type="number" class="form-control"
                               id="precio" name="price"
                               value="{{console.price}}"
                               placeholder="Ej. 499.99"
                               min="0" max="1000000" step="0.01" required>
                    </div>

                    <!-- Rating -->
                    <div class="campo">
                        <label for="valoracion" class="form-label">
                            Valoración (de 0 a 5) *
                        </label>
                         <input type="number"
                          class="form-control"
                          id="valoracion"
                          name="rate"
                          value="{{console.rate}}"
                          placeholder="Ej. 4.3"
                          max="5"
                          min="0"
                          step="0.1"
                          required>
                    </div>

                    <!-- Description -->
                    <div class="campo">
                        <label for="descripcion" class="form-label">
                            Descripción *
                        </label>

                        <textarea class="form-control"
                                  id="descripcion" name="description"
                                  rows="4"
                                  placeholder="Describe las características de la consola..."
                                  required maxlength="1000">{{console.description}}</textarea>
                    </div>

                    <!-- Submit / Cancel buttons -->
                    <div class="d-flex flex-column flex-sm-row gap-2 mt-4">

                        <button type="submit"
                                class="btn btn-dark flex-fill">
                            <i class="bi bi-check-circle"></i>
                            {{submitText}}
                        </button>

                        <a href="{{cancelUrl}}"
                           class="btn btn-outline-danger flex-fill">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>
    </section>

    <!-- Footer-->
    {{>partials/footer}}
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
